<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>iARCS has moved</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://saugat2002.github.io/iarcs/">
  <meta http-equiv="refresh" content="0; url=https://saugat2002.github.io/iarcs/">
  <script>
    // Keep the sub-path, query and hash: /iarcs-webpage/x -> /iarcs/x
    var p = location.pathname.replace(/^\/iarcs-webpage\/?/, '');
    location.replace('https://saugat2002.github.io/iarcs/' + p + location.search + location.hash);
  </script>
</head>
<body>
  <p>The iARCS project page has moved to <a href="https://saugat2002.github.io/iarcs/">saugat2002.github.io/iarcs</a>.</p>
</body>
</html>
